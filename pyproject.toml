[project]
name = "mse-pi-watch-water-resistance"
version = "0.1.0"
description = "A Python package for monitoring water resistance of MSE Pi Watch devices."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dwfpy>=1.2.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.0",
    "qt-material>=2.17",
]

[tool.uv]
package = true

[tool.ruff]
select = ["FIX002",
    "E", "F"
]

[project.scripts]
example-ad3 = "examples.example_ad3:main"
example-ui = "examples.example_ui:main"
